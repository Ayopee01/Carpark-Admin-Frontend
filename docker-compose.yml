# Admin Frontend บน server (อยู่หลัง Nginx Proxy Manager ผ่าน npm-network)
# ADMIN_IMAGE มาจาก GitHub Actions เช่น ghcr.io/ayopee01/carpark-admin-frontend:<commit sha>
# rollback: ADMIN_IMAGE=ghcr.io/ayopee01/carpark-admin-frontend:<sha เดิม> docker compose up -d
services:
  admin-frontend:
    image: ${ADMIN_IMAGE:?ADMIN_IMAGE is required}
    container_name: smart-carpark-admin
    restart: unless-stopped
    environment:
      # server ของหน้าเว็บเรียก API ผ่าน npm-network (container ของ API อยู่ใน network เดียวกัน)
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://smart-carpark-api:8080}
      # origin ของ API ที่ browser ต่อ Socket.IO (/admin) ตรง เช่น https://api.<domain> (ว่าง = ผ่าน Nginx ที่ /socket.io ของโดเมนนี้)
      REALTIME_URL: ${REALTIME_URL:-}
    networks:
      - npm-network

networks:
  npm-network:
    external: true
