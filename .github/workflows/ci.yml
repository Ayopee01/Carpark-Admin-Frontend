# CI: ตรวจ lint, type และ build ทุก pull request และทุก push ที่ไม่ใช่ main (main ตรวจใน deploy.yml)
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # ค่าจริงฝังตอน build image ใน deploy.yml ส่วน CI ใช้ค่าตัวอย่าง
      NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
