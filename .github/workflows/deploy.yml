# CD: push เข้า main -> ตรวจ -> build Docker image -> push ไป GHCR -> SSH เข้า server แล้ว docker compose up
#
# ต้องตั้งใน GitHub (Settings -> Environments -> production):
#   Variables: NEXT_PUBLIC_API_BASE_URL  origin ของ API เช่น https://api.<domain> (ฝังตอน build)
#              DEPLOY_PATH               โฟลเดอร์บน server ที่เก็บ docker-compose.yml
#   Secrets:   DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_SSH_KEY
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  image:
    name: Build and push image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Check settings
        env:
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::ยังไม่ได้ตั้ง variable NEXT_PUBLIC_API_BASE_URL ใน environment production"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ vars.DEPLOY_PATH }}
      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        env:
          ADMIN_IMAGE: ${{ needs.image.outputs.image }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ADMIN_IMAGE,DEPLOY_PATH,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -e
            cd "$DEPLOY_PATH"
            # GITHUB_TOKEN ใช้ได้แค่ระหว่าง job นี้ จึง logout ทันทีหลัง pull
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            ADMIN_IMAGE="$ADMIN_IMAGE" docker compose pull
            docker logout ghcr.io
            ADMIN_IMAGE="$ADMIN_IMAGE" docker compose up -d --wait --wait-timeout 120
            echo "$ADMIN_IMAGE" > .deployed-image
            docker image prune -f
